[package]
name = "rustysynth_test"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustysynth = { path = "../rustysynth" }

[features]
# Adds the SoundFont3 snapshot tests, which load and decode
# FluidR3Mono_GM.sf3 through the `sf3` feature of rustysynth.
sf3 = ["rustysynth/sf3"]
