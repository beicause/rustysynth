name: Publish

# Publishing lives in its own workflow rather than in `ci.yml` because the two
# want opposite things: `ci.yml` runs on every pull request and must never be
# able to write to the registry, while a release is started by hand and does
# nothing else.
#
# What the job publishes with is not a stored secret. It proves its identity to
# crates.io with the OIDC token GitHub mints for it, and
# `rust-lang/crates-io-auth-action` exchanges that for an access token which
# lives half an hour and is bound to this repository, this workflow file and the
# environment named below. There is nothing to rotate and nothing that can be
# stolen.
#
# `rustysynth-ext` needs its own Trusted Publishing configuration on crates.io,
# and it has to name this repository, this workflow file (`publish.yml`) and the
# `release` environment. Leaving the environment field empty there is allowed: a
# configuration without one accepts any.
#
# A dispatch runs against whichever branch or tag it is started from: the
# package carries that commit's sources, and crates.io cannot know or check
# which it is. Start it from the commit `ci.yml` has already passed.

on:
  workflow_dispatch:

# One release at a time, and never cancelled. A publish that is interrupted
# leaves the registry holding part of a release, and a version that is already
# up cannot be replaced — only a new version can be published over it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"
  CACHE_SUFFIX: f # cache busting

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # The environment is what a protection rule hangs off — required reviewers,
    # a deployment branch — so that a dispatch is not by itself enough to
    # publish.
    environment: release
    # Publishing verifies the package by building it: one compilation of a
    # pure-Rust crate whose only dependencies are the optional Symphonia
    # decoders.
    timeout-minutes: 15
    permissions:
      # The OIDC token crates.io verifies the workflow's identity with.
      # Everything else the job does is a read.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # The token is handed to cargo as `CARGO_REGISTRY_TOKEN`, the variable it
      # reads by name, rather than as `--token`, which would put it in the
      # command line the log records.
      #
      # The action's post step revokes it when the job ends rather than leaving
      # it to expire.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6

      # `rustysynth-ext` is the only publishable crate here: `example`,
      # `rustysynth_test` and `xtask` are workspace-only and say so with
      # `publish = false`, so `--workspace` would have nothing else to upload.
      #
      # There is no separate `--dry-run` pass. `cargo publish` builds the package
      # it is about to upload and stops before uploading if that fails, so the
      # upload already carries the check a dry run would make.
      - name: Publish `rustysynth-ext`
        run: cargo publish -p rustysynth-ext
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
