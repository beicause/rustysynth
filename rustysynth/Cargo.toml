[package]
name = "rustysynth-ext"
version = "1.5.0-alpha.1"
edition = "2024"

description = "A SoundFont (sf2, sf3) MIDI synthesizer written in pure Rust (a fork of rustysynth)"
documentation = "https://docs.rs/rustysynth-ext/latest/rustysynth_ext/"
readme = "../README.md"
repository = "https://github.com/beicause/rustysynth"
license = "MIT"
keywords = ["audio", "midi", "music", "soundfont", "synthesizer"]
categories = ["multimedia::audio"]

[package.metadata.docs.rs]
# `all-features` makes the private SoundFont3 module show up in the docs.
all-features = true

[dependencies]
symphonia-codec-vorbis = { version = "0.5", default-features = false, optional = true }
symphonia-core = { version = "0.5", default-features = false, optional = true }
symphonia-format-ogg = { version = "0.5", default-features = false, optional = true }

[features]
# Enables loading of SoundFont3 (.sf3) files, whose samples are compressed
# with Ogg Vorbis. Pulls in the pure-Rust Symphonia decoder.
sf3 = ["dep:symphonia-codec-vorbis", "dep:symphonia-core", "dep:symphonia-format-ogg"]

[lints]
workspace = true
