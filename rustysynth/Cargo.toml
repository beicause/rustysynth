[package]
name = "rustysynth-ext"
version = "1.4.0"
edition = "2024"

description = "A SoundFont (sf2, sf3) MIDI synthesizer written in pure Rust (a fork of rustysynth)"
documentation = "https://docs.rs/rustysynth-ext/latest/rustysynth_ext/"
readme = "README.md"
repository = "https://github.com/beicause/rustysynth"
license = "MIT"
keywords = ["audio", "midi", "music", "soundfont", "synthesizer"]
categories = ["multimedia::audio"]

[dependencies]
lewton = { version = "0.10", optional = true }

[features]
# Enables loading of SoundFont3 (.sf3) files, whose samples are compressed
# with Ogg Vorbis. Pulls in the pure-Rust `lewton` decoder.
sf3 = ["dep:lewton"]

[lints]
workspace = true
